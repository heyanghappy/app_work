name: gromore_ads
description: GroMore广告聚合Flutter插件，支持多种广告类型 / GroMore ad aggregation Flutter plugin with unified API
version: 1.0.3
homepage: https://www.zhecent.com/sdks/flutter-gromore-ads
repository: https://github.com/Xlxinxi/flutter_gromore_ads
documentation: https://www.zhecent.com/sdks/flutter-gromore-ads

environment:
  sdk: ^3.9.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zhecent.gromore_ads
        pluginClass: GromoreAdsPlugin
      ios:
        pluginClass: GromoreAdsPlugin
