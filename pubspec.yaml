name: app_weather
description: 极简天气 App，Flutter 跨端实现，接入和风天气。
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.66.0
  # 本地 fork：官方 1.0.3 未暴露「移除开屏容器」方法，导致广告未正常关闭时
  # 黑色容器残留盖住主页。此处扩展 destroySplash，仅新增方法，其余与原版一致。
  gromore_ads:
    path: plugins/gromore_ads_local

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/splash_bg.png
